# Builds the web app from a clean checkout and publishes it to GitHub Pages.
# Health data never exists here (it is git-ignored and only ever imported on the user's phone), and the leak guard
# in scripts/web-postexport.mjs refuses to publish a build that contains any.
#
# Third-party actions are pinned to full commit SHAs so a moved tag can't change what runs.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege: read the code, publish to Pages, nothing else
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install exactly what package-lock.json pins
        run: npm ci

      - name: Verify package signatures from the npm registry
        run: npm audit signatures

      - name: Dependency audit (fails on critical; high is reported)
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reports high-severity advisories (see log). Check Dependabot alerts."
          npm audit --omit=dev --audit-level=critical

      - name: Lint the data-handling code (incl. the rule that blocks importing health data into the app)
        run: npx eslint src/health src/app/_layout.tsx src/app/health-data.tsx src/components/health-import.tsx src/components/welcome.tsx src/lib

      - name: Tests
        run: npm test

      - name: Build
        run: npx expo export -p web

      - name: Leak guard, CSP, 404.html, .nojekyll
        run: node scripts/web-postexport.mjs dist

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
