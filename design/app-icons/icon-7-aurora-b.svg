<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 7: a frosted-glass B floating over soft aurora colours (lime, teal, lavender) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14261E"/>
      <stop offset="1" stop-color="#0C1712"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="300" y1="210" x2="720" y2="830">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EAF6DA" stop-opacity="0.68"/>
    </linearGradient>
    <path id="b" d="M335 268 V768 M335 268 H500 A107 107 0 0 1 500 482 H335 M335 482 H525 A143 143 0 0 1 525 768 H335"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="330" cy="720" r="250" fill="#B8F53D" opacity="0.55"/>
    <circle cx="720" cy="300" r="240" fill="#3FD1B5" opacity="0.42"/>
    <circle cx="740" cy="760" r="210" fill="#9B87FF" opacity="0.50"/>
  </g>
  <g transform="translate(0,-6)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#b" stroke="#0A1410" stroke-width="112" opacity="0.28" filter="url(#soft)" transform="translate(0,20)"/>
    <use href="#b" stroke="#FFFFFF" stroke-width="122" opacity="0.30"/>
    <use href="#b" stroke="url(#glass)" stroke-width="106"/>
  </g>
</svg>
