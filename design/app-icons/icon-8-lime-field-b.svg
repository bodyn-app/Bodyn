<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 8: a full soft-lime field with a deep-green B, the bold colour-block look -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5EF98"/>
      <stop offset="1" stop-color="#98CF48"/>
    </linearGradient>
    <radialGradient id="light" cx="28%" cy="22%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="210" x2="0" y2="826">
      <stop offset="0" stop-color="#22452D"/>
      <stop offset="1" stop-color="#13291B"/>
    </linearGradient>
    <path id="b" d="M335 268 V768 M335 268 H500 A107 107 0 0 1 500 482 H335 M335 482 H525 A143 143 0 0 1 525 768 H335"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  <g transform="translate(0,-6)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="112">
    <use href="#b" stroke="url(#ink)"/>
  </g>
</svg>
