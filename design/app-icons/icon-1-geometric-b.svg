<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 1: geometric B, a stem and two round bowls (like the app's rings), soft lime on deep green -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3022"/>
      <stop offset="1" stop-color="#0E1A12"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#B8F53D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B8F53D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" gradientUnits="userSpaceOnUse" x1="0" y1="210" x2="0" y2="826">
      <stop offset="0" stop-color="#DDF9A2"/>
      <stop offset="1" stop-color="#A2D850"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <path id="b" d="M335 268 V768 M335 268 H500 A107 107 0 0 1 500 482 H335 M335 482 H525 A143 143 0 0 1 525 768 H335"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g transform="translate(0,-6)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="112">
    <use href="#b" stroke="#B8F53D" opacity="0.32" filter="url(#glow)"/>
    <use href="#b" stroke="url(#lime)"/>
  </g>
</svg>
