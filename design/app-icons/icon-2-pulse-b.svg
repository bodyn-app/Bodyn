<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 2: B drawn as one light line, fed by a heartbeat blip coming in from the left -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3022"/>
      <stop offset="1" stop-color="#0E1A12"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#B8F53D" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#B8F53D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="834">
      <stop offset="0" stop-color="#E2FAAA"/>
      <stop offset="1" stop-color="#9ED44B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
    <path id="b" d="M450 270 V730 M450 270 H675 A115 115 0 0 1 675 500 H450 M450 500 H675 A115 115 0 0 1 675 730 H450 H390 L360 640 L322 800 L296 730 H196"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g transform="translate(0,-23)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="68">
    <use href="#b" stroke="#B8F53D" opacity="0.4" filter="url(#glow)"/>
    <use href="#b" stroke="url(#lime)"/>
  </g>
</svg>
