<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 10: a calm blue-teal night palette, a mint B with a small lavender moon (sleep) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14343C"/>
      <stop offset="1" stop-color="#0B1B22"/>
    </linearGradient>
    <radialGradient id="halo" cx="45%" cy="52%" r="55%">
      <stop offset="0" stop-color="#5CE0C0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#5CE0C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="0" y1="212" x2="0" y2="826">
      <stop offset="0" stop-color="#D8F8EA"/>
      <stop offset="1" stop-color="#8FDCC5"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9BEFF"/>
      <stop offset="1" stop-color="#9B87FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
    <mask id="crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="742" cy="262" r="50" fill="#fff"/>
      <circle cx="762" cy="246" r="44" fill="#000"/>
    </mask>
    <path id="b" d="M335 268 V768 M335 268 H500 A107 107 0 0 1 500 482 H335 M335 482 H525 A143 143 0 0 1 525 768 H335"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g transform="translate(-28,10)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="104">
    <use href="#b" stroke="#5CE0C0" opacity="0.26" filter="url(#glow)"/>
    <use href="#b" stroke="url(#mint)"/>
  </g>
  <g mask="url(#crescent)" transform="translate(0,20)"><rect x="660" y="180" width="200" height="200" fill="url(#moon)"/></g>
</svg>
