<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 4: the coach's glowing orb with a B carved out of it -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3022"/>
      <stop offset="1" stop-color="#0E1A12"/>
    </linearGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#E6FFA6"/>
      <stop offset="0.45" stop-color="#B9EC4A"/>
      <stop offset="1" stop-color="#4E9E3A"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#B8F53D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#B8F53D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <mask id="carve" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
        <path d="M430 384 V640 M430 384 H500 A64 64 0 0 1 500 512 H430 M430 512 H515 A64 64 0 0 1 515 640 H430"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="440" fill="url(#halo)"/>
  <g mask="url(#carve)">
    <circle cx="512" cy="512" r="310" fill="url(#orb)"/>
    <ellipse cx="410" cy="350" rx="110" ry="60" fill="#fff" opacity="0.28" filter="url(#soft)" transform="rotate(-28 410 350)"/>
  </g>
</svg>
